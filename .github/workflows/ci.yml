name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            go: 1.25.x
          - os: ubuntu-24.04
            go: 1.27.x
          - os: macos-15
            go: 1.27.x
    runs-on: ${{ matrix.os }}
    # Measured 77-root crash suite: retain whole-package race x3, not a runtime SLO.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Verify dependency checksums
        run: go mod verify
      - name: Race and failure tests under private umask
        run: |
          umask 077
          go test -race -timeout=20m -count=3 ./...
      - name: Verify inherited quota filter in CGO-free child processes
        if: runner.os == 'Linux'
        run: GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0 go test -count=3 -run 'TestQuota' ./internal/warden
      - name: Verify installer output bounds in CGO-free child processes
        if: runner.os == 'Linux'
        run: GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0 go test -count=3 -run 'TestManagerWriter|TestManagerCaptureActualChild' ./internal/installtxn
      - name: Build and process smoke test
        run: make smoke
      - name: Test opt-in nested host fixture only on Linux
        if: runner.os == 'Linux'
        run: go test -tags=xandbox_host_fixture -race -count=3 ./cmd/xandbox-host-fixture
      - name: Verify OOM fixture guards and Stop contract in CGO-free build
        if: runner.os == 'Linux'
        run: GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0 go test -tags=xandbox_host_fixture -count=3 -run '^TestNodeOOM' ./cmd/xandbox-host-fixture
      - name: Verify sustained-load closed protocol guards in CGO-free build
        if: runner.os == 'Linux'
        run: GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0 go test -tags=xandbox_host_fixture -count=3 -run '^TestNodeLoad' ./cmd/xandbox-host-fixture
      - name: Test opt-in owned systemd deployment helper only on Linux
        if: runner.os == 'Linux'
        run: go test -tags=xandbox_deploy_fixture -race -count=3 ./cmd/xandbox-deploy-fixture
      - name: Test opt-in owned initial installer PKI helper only on Linux
        if: runner.os == 'Linux'
        run: go test -tags=xandbox_install_fixture -race -count=3 ./cmd/xandbox-install-fixture
      - name: Test opt-in owned managed policy PKI producer only on Linux
        if: runner.os == 'Linux'
        run: go test -tags=xandbox_managed_fixture -race -count=3 ./cmd/xandbox-managed-fixture
      - name: Python harness syntax and guest image extraction safety
        run: |
          python3 -m unittest discover -s scripts -p test_doctor_smoke.py
          python3 -m unittest discover -s scripts -p test_node_oom.py
          python3 -m unittest discover -s scripts -p test_node_load.py
          python3 -m py_compile scripts/node_load_contract.py
          python3 -m py_compile scripts/kvm_snapshot_smoke.py scripts/kvm_snapshot_faults.py scripts/kvm_driver_smoke.py scripts/build_guest_fault_fixture.py
          python3 -m unittest discover -s scripts -p test_guest_image.py
          python3 -m unittest discover -s scripts -p test_guest_fault_fixture.py
          python3 -m unittest discover -s scripts -p test_process_exit.py
          python3 -m py_compile scripts/kvm_mixed_load.py scripts/kvm_resources.py
          python3 -m py_compile scripts/kvm_storage.py scripts/kvm_storage_faults.py
          python3 -m py_compile scripts/kvm_io_probe.py
          python3 -m py_compile scripts/build_nested_host.py scripts/kvm_nested_host.py
          python3 -m py_compile scripts/build_systemd_host.py scripts/systemd_delegate_probe.py scripts/kvm_systemd_host.py scripts/build_systemd_deployment.py scripts/systemd_deployment_guest.py scripts/build_systemd_ingress.py scripts/systemd_ingress_guest.py scripts/build_systemd_readiness.py scripts/systemd_readiness_guest.py scripts/readiness_fixture_gate.py scripts/systemd_drain_probe.py scripts/build_systemd_release.py scripts/systemd_release_guest.py scripts/process_exit.py
          python3 -m py_compile scripts/build_systemd_install.py scripts/systemd_install_guest.py scripts/install_fixture_trace.py
          python3 -m py_compile scripts/build_systemd_managed.py scripts/systemd_managed_guest.py scripts/managed_fixture_trace.py
          python3 -m unittest discover -s scripts -p 'test_kvm_*.py'

  linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: false
      - name: Verify fixed fixture pins against fresh canonical ordinary ELFs
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/xandbox-fixture-calibration"
          for program in sandboxd xandbox-gateway; do
            GOENV=off GOFLAGS='' GOTOOLCHAIN=go1.27.3 GOOS=linux GOARCH=amd64 GOAMD64=v1 CGO_ENABLED=0 \
              go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/xandbox-fixture-calibration/$program" "./cmd/$program"
          done
          python3 scripts/verify_fixture_calibration.py \
            --daemon "$RUNNER_TEMP/xandbox-fixture-calibration/sandboxd" \
            --gateway "$RUNNER_TEMP/xandbox-fixture-calibration/xandbox-gateway"
          for program in xandbox-ingress-launch xandbox-launch xandbox-node xandbox-ready xandbox-template xandbox-warden xandbox-install xandbox-release; do
            GOENV=off GOFLAGS='' GOTOOLCHAIN=go1.27.3 GOOS=linux GOARCH=amd64 GOAMD64=v1 CGO_ENABLED=0 \
              go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/xandbox-fixture-calibration/$program" "./cmd/$program"
          done
          for kind in deploy install managed; do
            output=deploy-helper
            if [ "$kind" = install ]; then output=setup; fi
            if [ "$kind" = managed ]; then output=managed-setup; fi
            GOENV=off GOFLAGS='' GOTOOLCHAIN=go1.27.3 GOOS=linux GOARCH=amd64 GOAMD64=v1 CGO_ENABLED=0 \
              go build -tags="xandbox_${kind}_fixture" -trimpath -buildvcs=false -o "$RUNNER_TEMP/xandbox-fixture-calibration/$output" "./cmd/xandbox-${kind}-fixture"
          done
          python3 scripts/systemd_fixture_provenance.py --programs-dir "$RUNNER_TEMP/xandbox-fixture-calibration"
      - name: Verify all nine fixed instruction sites without live tracing
        run: |
          umask 077
          GOENV=off GOFLAGS='' GOTOOLCHAIN=go1.27.3 GOOS=linux GOARCH=amd64 GOAMD64=v1 CGO_ENABLED=0 \
            XANDBOX_PREPARE_PROBE_ELF="$RUNNER_TEMP/xandbox-fixture-calibration/sandboxd" \
            go test -tags=xandbox_host_fixture -count=3 -v -run '^TestPrepareProbePinnedOrdinaryELF$' ./cmd/xandbox-host-fixture
      - name: Compile opt-in test-only guest observer
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags=xandbox_guest_fixture -trimpath -o /tmp/xandbox-fixture-observer ./cmd/xandbox-fixture-observer
      - name: Compile opt-in nested host fixture
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags=xandbox_host_fixture -trimpath -o /tmp/xandbox-host-fixture ./cmd/xandbox-host-fixture
      - name: Compile opt-in owned systemd deployment helper
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags=xandbox_deploy_fixture -trimpath -o /tmp/xandbox-deploy-fixture ./cmd/xandbox-deploy-fixture
      - name: Compile opt-in owned initial installer fixture helper
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags=xandbox_install_fixture -trimpath -o /tmp/xandbox-install-fixture ./cmd/xandbox-install-fixture
      - name: Compile opt-in owned managed policy fixture helper
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags=xandbox_managed_fixture -trimpath -o /tmp/xandbox-managed-fixture ./cmd/xandbox-managed-fixture
      - name: Build Linux amd64 and arm64
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/sandboxd-$arch" ./cmd/sandboxd
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/sandboxctl-$arch" ./cmd/sandboxctl
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/xandbox-node-$arch" ./cmd/xandbox-node
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/xandbox-doctor-$arch" ./cmd/xandbox-doctor
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/xandbox-launch-$arch" ./cmd/xandbox-launch
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/xandbox-ingress-launch-$arch" ./cmd/xandbox-ingress-launch
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/xandbox-ready-$arch" ./cmd/xandbox-ready
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/xandbox-release-$arch" ./cmd/xandbox-release
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/xandbox-install-$arch" ./cmd/xandbox-install
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/xandbox-keygen-$arch" ./cmd/xandbox-keygen
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/xandbox-agent-$arch" ./cmd/xandbox-agent
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/xandbox-warden-$arch" ./cmd/xandbox-warden
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/xandbox-guestctl-$arch" ./cmd/xandbox-guestctl
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/xandbox-template-$arch" ./cmd/xandbox-template
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/xandbox-gateway-$arch" ./cmd/xandbox-gateway
          done

  vulnerability-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify fail-closed secret gate unit controls
        run: python3 -m unittest discover -s scripts -p test_secret_scan.py
      - name: Install hash-pinned scanner into private exclusive directory
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/xandbox-secret-tools"
          python3 scripts/install_secret_scanner.py --destination "$RUNNER_TEMP/xandbox-secret-tools/gitleaks"
      - name: Verify actual positive, deleted-history, merge and redaction controls
        run: python3 scripts/secret_scan_smoke.py --scanner "$RUNNER_TEMP/xandbox-secret-tools/gitleaks"
      - name: Scan all reachable non-shallow history without publishing raw findings
        run: python3 scripts/secret_scan.py --scanner "$RUNNER_TEMP/xandbox-secret-tools/gitleaks"
